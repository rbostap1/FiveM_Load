<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background -->
    <div id="background-container">
        <div id="background-overlay"></div>
    </div>

    <!-- Music Player Container -->
    <div id="music-container"></div>

    <!-- Media Player -->
    <div id="media-player" class="media-player">
        <div class="player-wrapper">
            <div id="player-display"></div>
            <div class="player-controls">
                <button id="player-close" class="player-btn" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Music Control Button -->
    <button id="music-toggle" class="music-control">
        <i class="fas fa-volume-up"></i>
    </button>

    <!-- Main Container -->
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="logo-container">
                <img id="server-logo" src="" alt="Server Logo">
            </div>
            <h1 id="server-name" class="server-name"></h1>
            <div class="loading-bar-container">
                <div class="loading-bar">
                    <div class="loading-bar-fill"></div>
                </div>
                <p class="loading-text">Loading<span class="dots"></span></p>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Column -->
            <div class="column left-column">
                <!-- Staff Section -->
                <section class="card staff-card">
                    <h2 class="card-title">
                        <i class="fas fa-users"></i> Server Staff
                    </h2>
                    <div id="staff-list" class="staff-list"></div>
                </section>

                <!-- Social Media Links -->
                <section class="card social-card">
                    <h2 class="card-title">
                        <i class="fas fa-share-nodes"></i> Connect With Us
                    </h2>
                    <div id="social-links" class="social-links"></div>
                </section>
            </div>

            <!-- Right Column -->
            <div class="column right-column">
                <!-- Updates Section -->
                <section class="card updates-card">
                    <h2 class="card-title">
                        <i class="fas fa-bullhorn"></i> Announcements
                    </h2>
                    <div id="updates-list" class="updates-list"></div>
                </section>

                <!-- Rules Button -->
                <a id="rules-link" href="#" target="_blank" class="rules-button">
                    <i class="fas fa-book"></i> Server Rules
                </a>
            </div>
        </div>
    </div>

    <!-- Update Details Modal -->
    <div id="update-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
