<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="background-container">
        <div class="bg-grid"></div>
        <div class="bg-blob blob-a"></div>
        <div class="bg-blob blob-b"></div>
        <div id="background-overlay"></div>
    </div>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <button id="music-toggle" class="music-control" aria-label="Toggle music">
        <i class="fas fa-volume-up"></i>
    </button>

    <div id="music-container"></div>

    <div id="media-player" class="media-player">
        <div class="player-wrapper">
            <div id="player-display"></div>
            <div class="player-controls">
                <button id="player-close" class="player-btn" title="Close player">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="frame">
        <header class="hero">
            <div class="brand">
                <div class="brand-logo">
                    <img id="server-logo" src="" alt="Server logo">
                </div>
                <div class="brand-copy">
                    <p class="eyebrow">Now entering</p>
                    <h1 id="server-name" class="server-name"></h1>
                    <p class="lede">Syncing assets, spinning up the city, and making sure everything feels seamless.</p>
                </div>
            </div>

            <div class="hero-actions">
                <a id="rules-link" href="#" target="_blank" class="ghost-button">
                    <i class="fas fa-book"></i>
                    <span>Rules & Guidelines</span>
                </a>

                <div class="progress-card">
                    <div class="progress-header">
                        <span>Loading session</span>
                        <span id="progress-label">Booting</span>
                    </div>
                    <div class="loading-bar">
                        <div class="loading-bar-fill" id="loading-progress-fill"></div>
                    </div>
                    <p class="loading-text">Stay put—your character and world are coming online.</p>
                </div>
            </div>
        </header>

        <main class="content-grid">
            <section class="card updates-card">
                <div class="card-heading">
                    <div>
                        <p class="eyebrow">Announcements</p>
                        <h2>Fresh off the devline</h2>
                    </div>
                    <div class="badge">Live</div>
                </div>
                <div id="updates-list" class="updates-list timeline"></div>
            </section>

            <section class="card staff-card">
                <div class="card-heading">
                    <p class="eyebrow">Crew</p>
                    <h2>Meet your staff</h2>
                </div>
                <div id="staff-list" class="staff-list"></div>
            </section>

            <section class="card social-card">
                <div class="card-heading">
                    <p class="eyebrow">Connect</p>
                    <h2>Stay in the loop</h2>
                </div>
                <div id="social-links" class="social-links"></div>
            </section>
        </main>
    </div>

    <!-- Update Details Modal -->
    <div id="update-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">
                <i class="fas fa-times"></i>
            </button>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
